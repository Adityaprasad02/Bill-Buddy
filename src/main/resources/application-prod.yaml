server:
  port: ${PORT:8000}

spring:
  datasource:
    url: ${DB_URL}?prepareThreshold=0
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}
    driver-class-name: org.postgresql.Driver
    hikari:
      maximum-pool-size: 5
      minimum-idle: 2
      idle-timeout: 30000
      max-lifetime: 600000
      connection-timeout: 20000
  jpa:
    hibernate:
      ddl-auto: update
    database-platform: org.hibernate.dialect.PostgreSQLDialect
    properties:
      hibernate:
        default_schema: public
  security:
    oAuth2:
      client:
        registration:
          google:
            client-id: ${CLIENT_ID}
            client-secret: ${CLIENT_SECRET}
            scope:
              - email
              - openid
              - profile


supabase:
  url: ${SUPABASE_URL}
  service-role-key: ${SERVICE_ROLE_KEY}
  bucket: ${SUPABASE_BUCKET}

paytm:
  merchant-id: ${PAYTM_MERCHANT_ID}
  merchant-key: ${PAYTM_MERCHANT_KEY}
  base-url: ${PAYTM_BASE_URL}

logging:
  level:
    com:
      paytm: OFF
    paytm:
      pg: OFF

security:
  jwt:
    secret: ${SECRET}
    issuer: Bill-Bridge
    access-token-expiration: ${ACCESS_TOKEN_EXPIRATION} # 8 minutes in milliseconds
    refresh-token-expiration: ${REFRESH_TOKEN_EXPIRATION} # 10 minutes in milliseconds
    refresh-token-cookie-name: refreshToken
    cookie-secure: true
    cookie-http-only: true
    cookie-same-site: lax
    cookie-domain: ${COOKIE_DOMAIN}

frontend:
  url: ${FRONTEND_URL}





