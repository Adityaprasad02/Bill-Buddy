<!DOCTYPE html>
<html lang="en">
<head>
    <title>User Dashboard</title>
    <style>
        .hidden { display: none !important; }
        .message { 
            padding: 12px; 
            margin: 15px 0; 
            border-radius: 6px; 
            font-weight: 500;
        }
        .success-msg { background: #e8f5e9; color: #2e7d32; }
        .warning-msg { background: #fff3e0; color: #ef6c00; }
        form { max-width: 480px; margin: 20px 0; }
        input { 
            display: block; 
            width: 100%; 
            padding: 10px; 
            margin: 10px 0; 
            box-sizing: border-box; 
            border: 1px solid #ccc; 
            border-radius: 4px;
        }
        button { 
            padding: 12px 24px; 
            background: #1976d2; 
            color: white; 
            border: none; 
            border-radius: 4px; 
            cursor: pointer; 
        }
        button:hover { background: #1565c0; }
        #resultdiv { margin-top: 20px; padding: 15px; background: #f8f9fa; border-radius: 6px; }
    </style>
</head>
<body>

<h2>User Dashboard</h2>

<div id="data"></div>
<p id="error" style="color:red; font-weight:bold;"></p>

<!-- Merchant section - will be shown/hidden based on role & status -->
<div id="merchant-section" class="hidden">
    <div id="already-merchant" class="hidden">
        <div class="message success-msg">
            You are already registered as a Merchant ✓
        </div>
        <!-- You can add merchant dashboard link or info here later -->
    </div>

    <div id="not-merchant" class="hidden">
        <div class="message warning-msg" id="merchant-message">
            Not registered as merchant yet. Please register below.
        </div>

        <form id="registermerchant">
            <input name="businessName"   placeholder="Business Name"        type="text" required />
            <input name="type"           placeholder="Merchant Type (ONLINE / OFFLINE)" type="text" required />
            <input name="address"        placeholder="Full Address"         type="text" required />
            <input name="gstNumber"      placeholder="GST Number"           type="text" required />
            <button type="submit">Register as Merchant</button>
        </form>

        <div id="resultdiv"></div>
    </div>
</div>

<button onclick="logout()">Logout</button>

<script>
    const merchantSection   = document.getElementById("merchant-section");
    const alreadyMerchant   = document.getElementById("already-merchant");
    const notMerchant       = document.getElementById("not-merchant");
    const merchantMessage   = document.getElementById("merchant-message");
    const resultDiv         = document.getElementById("resultdiv");

    async function loadUserAndCheckMerchant() {
        try {
            // Step 1: Get current user
            const userRes = await fetch("/user/me", { credentials: "include" });
            if (!userRes.ok) {
                throw new Error("Session expired or unauthorized");
            }

            const user = await userRes.json();

            // Show basic user info
            document.getElementById("data").innerHTML = `
                <p><b>ID:</b> ${user.id}</p>
                <p><b>Username:</b> ${user.username}</p>
                <p><b>Email:</b> ${user.email}</p>
                <p><b>Role:</b> ${user.role}</p>
            `;

            // Step 2: Role-based logic
            const role = (user.role || "").toUpperCase().trim();

            if (role === "CUSTOMER" || role === "USER") {
                // Normal customer → no merchant features
                merchantSection.classList.add("hidden");
                return;
            }

            // If not customer → probably merchant or admin → check merchant status
            merchantSection.classList.remove("hidden");

            // Step 3: Check if user is registered as merchant
            const merchantRes = await fetch("/merchant/getDetails", { 
                credentials: "include" 
            });

            if (merchantRes.ok) {
                // Already a merchant
                alreadyMerchant.classList.remove("hidden");
                notMerchant.classList.add("hidden");
            } else {
                // Not registered yet
                const errData = await merchantRes.json().catch(() => ({}));
                const msg = errData.message || "Merchant profile not found";

                merchantMessage.innerText = `Not available — ${msg}. Please register as merchant.`;
                notMerchant.classList.remove("hidden");
                alreadyMerchant.classList.add("hidden");
            }

        } catch (err) {
            document.getElementById("error").innerText = err.message;
            // Optional: redirect to login after delay
            setTimeout(() => {
                window.location.href = "/login.html";
            }, 2500);
        }
    }

    // Form submit - only active when form is visible
    document.getElementById("registermerchant").addEventListener("submit", async (e) => {
        e.preventDefault();

        const form = e.target;
        const formData = new FormData(form);

        const data = {
            businessName: formData.get("businessName")?.trim(),
            type:         formData.get("type")?.trim(),
            address:      formData.get("address")?.trim(),
            gstNumber:    formData.get("gstNumber")?.trim(),
        };

        console.log("Sending merchant data:", data);

        if (!data.businessName || !data.type || !data.address || !data.gstNumber) {
            resultDiv.innerHTML = '<p style="color:red;">Please fill all fields</p>';
            return;
        }

        resultDiv.innerHTML = "<p>Sending...</p>";

        try {
            const res = await fetch("/merchant/register", {
                method: "POST",
                headers: { "Content-Type": "application/json" },
                credentials: "include",
                body: JSON.stringify(data)
            });

            if (!res.ok) {
                const err = await res.json().catch(() => ({}));
                throw new Error(err.message || `Server error: ${res.status}`);
            }

            const result = await res.json();
            resultDiv.innerHTML = `
                <h3 style="color:green">Registered Successfully!</h3>
                <pre style="background:#f0f8ff; padding:12px; border:1px solid #bbdefb; border-radius:6px;">
${JSON.stringify(result, null, 2)}
                </pre>
            `;

            // After success → refresh status (form should disappear)
            setTimeout(loadUserAndCheckMerchant, 1800);

        } catch (err) {
            resultDiv.innerHTML = `<p style="color:red; font-weight:bold;">Failed: ${err.message}</p>`;
            console.error(err);
        }
    });

    // Start on page load
    loadUserAndCheckMerchant();

    function logout() {
        fetch("/logout", { credentials: "include" })
            .catch(() => {})
            .finally(() => {
                window.location.href = "/login.html";
            });
    }
</script>

</body>
</html>
